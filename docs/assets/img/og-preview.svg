<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">HRMS Laravel engineering portfolio</title>
  <desc id="description">A minimal cream, black, neon-lime, and blue portfolio banner presenting a production-style HRMS built with Laravel 12.</desc>

  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#171914" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#f2f0e8"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="30" y="28" width="1140" height="574" fill="none" stroke="#171914" stroke-width="1.5"/>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <!-- Header -->
    <rect x="62" y="58" width="52" height="52" fill="#d8ff63" stroke="#171914" stroke-width="1.5"/>
    <text x="88" y="91" fill="#171914" font-size="18" font-weight="900" text-anchor="middle">HR</text>
    <text x="132" y="77" fill="#171914" font-size="15" font-weight="800" letter-spacing="1.5">HRMS / LARAVEL</text>
    <text x="132" y="101" fill="#62665d" font-size="13" font-weight="700" letter-spacing="1.4">ENGINEERING PORTFOLIO · LARAVEL 12</text>
    <text x="1138" y="78" fill="#62665d" font-size="12" font-weight="700" letter-spacing="1.6" text-anchor="end">PROJECT DOSSIER / 2026</text>
    <line x1="62" y1="126" x2="1138" y2="126" stroke="#c9c8bd" stroke-width="1"/>

    <!-- Primary message -->
    <circle cx="70" cy="164" r="6" fill="#a8d624"/>
    <circle cx="70" cy="164" r="12" fill="#a8d624" fill-opacity="0.16"/>
    <text x="92" y="169" fill="#171914" font-size="13" font-weight="800" letter-spacing="1.6">PRODUCTION-STYLE HUMAN RESOURCE MANAGEMENT SYSTEM</text>

    <text x="62" y="252" fill="#171914" font-size="72" font-weight="900" letter-spacing="-3.8">HR operations,</text>
    <text x="62" y="330" fill="#3157d5" font-size="82" font-weight="900" letter-spacing="-4.2">engineered.</text>

    <text x="64" y="374" fill="#474b43" font-size="19" font-weight="600">Custom RBAC · Employee lifecycle · Attendance · Leave · Payroll · Reports</text>

    <!-- Proof points -->
    <g transform="translate(62 412)">
      <rect width="154" height="86" fill="#fffef9" stroke="#171914" stroke-width="1.25"/>
      <text x="18" y="38" fill="#171914" font-size="28" font-weight="900">10</text>
      <text x="18" y="65" fill="#62665d" font-size="11" font-weight="800" letter-spacing="1.2">PRODUCT AREAS</text>

      <rect x="154" width="154" height="86" fill="#d8ff63" stroke="#171914" stroke-width="1.25"/>
      <text x="172" y="38" fill="#171914" font-size="28" font-weight="900">76</text>
      <text x="172" y="65" fill="#171914" font-size="11" font-weight="800" letter-spacing="1.2">AUTOMATED TESTS</text>

      <rect x="308" width="154" height="86" fill="#fffef9" stroke="#171914" stroke-width="1.25"/>
      <text x="326" y="38" fill="#171914" font-size="28" font-weight="900">280</text>
      <text x="326" y="65" fill="#62665d" font-size="11" font-weight="800" letter-spacing="1.2">ASSERTIONS</text>

      <rect x="462" width="154" height="86" fill="#fffef9" stroke="#171914" stroke-width="1.25"/>
      <text x="480" y="38" fill="#171914" font-size="24" font-weight="900">RBAC</text>
      <text x="480" y="65" fill="#62665d" font-size="11" font-weight="800" letter-spacing="1.2">CUSTOM ACCESS</text>
    </g>

    <!-- Architecture panel -->
    <rect x="777" y="157" width="361" height="342" fill="#d8ff63" stroke="#171914" stroke-width="1.5"/>
    <rect x="763" y="143" width="361" height="342" fill="#171914" stroke="#171914" stroke-width="1.5"/>

    <text x="789" y="177" fill="#d8ff63" font-family="Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.3">REQUEST / RESPONSE FLOW</text>
    <g transform="translate(1072 163)" fill="none" stroke="#777b70" stroke-width="1.5">
      <circle cx="0" cy="0" r="4"/>
      <circle cx="15" cy="0" r="4"/>
      <circle cx="30" cy="0" r="4"/>
    </g>
    <line x1="789" y1="194" x2="1098" y2="194" stroke="#484b43"/>

    <g font-family="Consolas, monospace">
      <text x="790" y="229" fill="#3157d5" font-size="12" font-weight="700">01</text>
      <text x="833" y="229" fill="#fffef9" font-size="15" font-weight="700">Route + middleware</text>
      <line x1="802" y1="241" x2="802" y2="257" stroke="#62665d"/>

      <text x="790" y="281" fill="#3157d5" font-size="12" font-weight="700">02</text>
      <text x="833" y="281" fill="#fffef9" font-size="15" font-weight="700">Form Request</text>
      <line x1="802" y1="293" x2="802" y2="309" stroke="#62665d"/>

      <text x="790" y="333" fill="#3157d5" font-size="12" font-weight="700">03</text>
      <text x="833" y="333" fill="#fffef9" font-size="15" font-weight="700">Thin Controller</text>
      <line x1="802" y1="345" x2="802" y2="361" stroke="#62665d"/>

      <text x="790" y="385" fill="#3157d5" font-size="12" font-weight="700">04</text>
      <text x="833" y="385" fill="#fffef9" font-size="15" font-weight="700">Service + Model</text>
      <line x1="802" y1="397" x2="802" y2="413" stroke="#62665d"/>

      <text x="790" y="437" fill="#d8ff63" font-size="12" font-weight="700">05</text>
      <text x="833" y="437" fill="#fffef9" font-size="15" font-weight="700">Blade Response</text>
      <text x="1089" y="437" fill="#d8ff63" font-size="16" font-weight="900">✓</text>
    </g>

    <rect x="789" y="455" width="98" height="7" fill="#3157d5"/>
    <rect x="897" y="455" width="64" height="7" fill="#d8ff63"/>
    <rect x="971" y="455" width="127" height="7" fill="#fffef9" fill-opacity="0.22"/>

    <!-- Footer -->
    <line x1="62" y1="542" x2="1138" y2="542" stroke="#171914" stroke-width="1.5"/>
    <text x="62" y="576" fill="#171914" font-family="Consolas, monospace" font-size="15" font-weight="700">github.com/farhanrahmananik/hrms-laravel</text>
    <text x="1138" y="576" fill="#62665d" font-size="15" font-weight="700" text-anchor="end">Md Farhan Rahman Anik</text>
  </g>
</svg>
